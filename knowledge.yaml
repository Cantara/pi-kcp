kcp_version: "0.30"
project: pi-kcp
version: 0.5.0
updated: "2026-07-14"
language: en

units:
  - id: front-door
    path: README.md
    intent: "What is pi-kcp, who is it for, and how does an agent or human get started?"
    scope: global
    audience: [agent, human]
    triggers: [overview, getting started, install, pi, KCP]
    hints: {load_strategy: eager}

  - id: agent-instructions
    path: AGENTS.md
    intent: "What architectural invariants, development rules, and verification commands govern pi-kcp?"
    scope: project
    audience: [agent, developer]
    triggers: [development, implementation, architecture, tests, conventions]

  - id: architecture
    path: docs/architecture.md
    intent: "How are Pi, KCP memory, kcp-agent, MCP, and optional code-intelligence providers separated?"
    scope: project
    audience: [agent, developer]
    triggers: [architecture, transport, MCP, Synthesis, memory, provider]

  - id: development-skill
    path: .pi/skills/pi-kcp-development/SKILL.md
    intent: "How should an agent implement and verify changes in pi-kcp without duplicating KCP services?"
    scope: project
    audience: [agent]
    triggers: [code, implement, refactor, verify, change]

  - id: installation-validation
    path: .pi/skills/installation-validation/SKILL.md
    intent: "How should an agent validate a fresh pi-kcp installation and its KCP integrations?"
    scope: project
    audience: [agent, developer]
    triggers: [install, smoke, validation, release, integration]

  - id: pr-evaluation
    path: .pi/skills/pr-evaluation/SKILL.md
    intent: "How should an agent evaluate a pull request against pi-kcp's standards before merging?"
    scope: project
    audience: [agent]
    triggers: [PR, pull request, review, evaluate, merge]

  - id: mcp-providers
    path: docs/mcp-providers.md
    intent: "How are optional KCP and code-intelligence MCP providers configured and substituted?"
    scope: project
    audience: [agent, developer]
    triggers: [MCP, provider, Synthesis, directTools, harness]

signing:
  scheme: ed25519
  scope: this-manifest
  public_key: "MCowBQYDK2VwAyEAuipgusnqU9vjf3p2yPVLD/DmERT6tBbLOqEETdxAhMU="
  # Relative, as kcp-agent and kcp-harness declare it: the signature is resolved beside the
  # manifest, wherever that manifest is read from. This pointed at raw.githubusercontent.com
  # on main — a branch this repo has not released from since v0.3.3 — so verification fetched
  # a signature for a different, older manifest and every --require-signature consumer was
  # refused. That branch also still serves the pre-envelope raw signature format.
  signature: "knowledge.yaml.sig"

# Serving Endpoint Binding (KCP SPEC v0.26 §3.12): authoritative manifest URL.
# Ignored by pre-0.26 verifiers.
serving:
  manifest:
    - https://raw.githubusercontent.com/Cantara/pi-kcp/main/knowledge.yaml
